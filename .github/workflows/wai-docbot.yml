```

## What this configuration covers

- Expo Router navigation across Android, iOS, web, and PWA targets
- AsyncStorage-based local snippet management and offline-first behavior
- Cloud synchronization, revision tracking, queues, soft deletion, and conflict resolution
- Express, tRPC, React Query, Drizzle ORM, and MySQL
- AI generation, explanation, conversion, related snippets, personality settings, and quotas
- Categories, collections, favorites, pinned snippets, sharing, and version history
- The Kotlin foreground service and Android floating-overlay module
- Android permissions, notifications, deep links, EAS builds, and GitHub Pages deployment
- Separation of hand-authored schema and migrations from generated Drizzle snapshots
