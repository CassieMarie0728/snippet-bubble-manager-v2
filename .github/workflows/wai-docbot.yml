  - "**/*.bundle.css"
  - "**/*.chunk.js"
  - "**/*.map"

  # Generated Drizzle snapshots and journals
  - "drizzle/meta/**"
  - "**/drizzle/meta/**"

  # Native Android generated output
  - "**/.gradle/**"
  - "**/android/build/**"
  - "**/android/app/build/**"
  - "**/android/.idea/**"
  - "**/android/captures/**"
  - "**/*.apk"
  - "**/*.aab"
  - "**/*.aar"
