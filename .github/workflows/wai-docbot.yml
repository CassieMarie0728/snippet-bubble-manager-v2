  - "**/.gitattributes"
  - ".gitkeep"
  - "**/.gitkeep"
  - ".github/wai-docbot.yml"
  - ".github/PULL_REQUEST_TEMPLATE/**"
  - ".github/pull_request_template.md"
  - ".github/CODEOWNERS"

  # IDE and local development metadata
  - ".idea/**"
  - "**/.idea/**"
  - ".vscode/**"
  - "**/.vscode/**"
  - ".vs/**"
  - "**/.vs/**"
  - ".history/**"
  - "**/.history/**"
  - ".settings/**"
  - "**/.settings/**"
  - ".DS_Store"
  - "**/.DS_Store"
  - "**/*.swp"
  - "**/*.swo"
  - "**/*~"
  - ".watchmanconfig"

  # Test output and snapshots
  - "__snapshots__/**"
  - "**/__snapshots__/**"
  - ".nyc_output/**"
  - "**/.nyc_output/**"
  - "test-results/**"
  - "**/test-results/**"
  - "playwright-report/**"
  - "**/playwright-report/**"
  - "**/*.snap"

  # Environment values, credentials, and signing material
  - ".env"
  - ".env.*"
  - "**/.env"
  - "**/.env.*"
  - "**/local.settings.json"
  - "**/credential.json"
  - "**/credentials.json"
  - "**/*.pem"
  - "**/*.key"
  - "**/*.p12"
  - "**/*.pfx"
  - "**/*.jks"
  - "**/*.keystore"
